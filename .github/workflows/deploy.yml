# Despliegue en cada push a main. Se autentica por OIDC: GitHub emite un token
# de identidad para la ejecucion y AWS devuelve credenciales temporales.
#
# El proveedor OIDC y el rol los crea scripts/connect-github-aws.sh, que ademas
# guarda los secretos AWS_DEPLOY_ROLE_ARN y ALERT_EMAIL.
#
# Sin pull_request: el rol solo se puede asumir desde refs/heads/main.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# id-token: write permite pedir el token OIDC.
permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1

jobs:
  deploy:
    name: Desplegar
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Ver claims del token
        run: |
          TOKEN=$(curl -sH "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          P=$(echo "$TOKEN" | cut -d. -f2)
          P="$P$(printf '=%.0s' $(seq $(( (4 - ${#P} % 4) % 4 ))))"
          echo "$P" | tr '_-' '/+' | base64 -d | jq '{sub, aud, repository, ref, event_name}'

      - name: Credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: bookslot-deploy-${{ github.run_id }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.10.5'
          terraform_wrapper: false

      # El nombre del bucket del estado lleva el id de cuenta y un bloque
      # backend no admite interpolacion, asi que se pasa en el init.
      #
      # terraform.tfvars no esta en el repositorio: alert_email entra como
      # variable de entorno.
      - name: Terraform
        id: tf
        working-directory: infra
        env:
          TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
        run: |
          CUENTA=$(aws sts get-caller-identity --query Account --output text)
          terraform init -input=false \
              -backend-config="bucket=bookslot-tfstate-$CUENTA"
          terraform apply -auto-approve -input=false

          terraform output -json > /tmp/outputs.json
          for k in api_invoke_url web_url web_bucket_name \
                   cloudfront_distribution_id cognito_user_pool_id cognito_client_id; do
            echo "$k=$(jq -r ".$k.value" /tmp/outputs.json)" >> "$GITHUB_OUTPUT"
          done

      # La interfaz no la gestiona Terraform.
      - name: Publicar la interfaz
        run: |
          cat > web/config.js <<CFG
          window.BOOKSLOT_CONFIG = {
            apiBaseUrl: "${{ steps.tf.outputs.api_invoke_url }}",
            userPoolId: "${{ steps.tf.outputs.cognito_user_pool_id }}",
            clientId:   "${{ steps.tf.outputs.cognito_client_id }}"
          };
          CFG

          aws s3 sync web/ "s3://${{ steps.tf.outputs.web_bucket_name }}/" \
            --delete --exclude "config.example.js"

          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.tf.outputs.cloudfront_distribution_id }}" \
            --paths '/*'

      - name: Resumen
        run: |
          echo "Aplicacion: ${{ steps.tf.outputs.web_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "API: ${{ steps.tf.outputs.api_invoke_url }}" >> "$GITHUB_STEP_SUMMARY"