# Verificacion, despliegue y pruebas en un solo workflow. `needs` es lo que
# encadena los jobs y lo que GitHub dibuja como grafo en la pestaña Actions.
#
# Los tres primeros no acceden a AWS y corren tambien en pull requests.
# Desplegar y Pruebas solo ocurren en push a main.
name: Pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: eu-west-1

jobs:
  api:
    name: Las funciones
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: api-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v5

      # La misma mayor que el runtime de las Lambdas.
      - name: Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      # No hay package.json: el SDK de AWS lo trae el runtime de Lambda.
      - name: Sintaxis de las funciones
        run: |
          for f in functions/*/index.mjs; do
            node --check "$f"
            echo "OK  $f"
          done

  infra:
    name: Infraestructura
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: infra-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.10.5'

      - name: Formato
        run: terraform fmt -check -recursive infra/

      # -backend=false valida sin credenciales y sin leer el estado remoto.
      - name: Validar
        working-directory: infra
        run: |
          terraform init -backend=false
          terraform validate

  web:
    name: La interfaz
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: web-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v5

      - name: Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Sintaxis de la interfaz
        run: |
          for f in web/*.js; do
            echo "· $f"
            node --check "$f"
          done

      # config.js lo genera el despliegue con los outputs de Terraform.
      - name: config.js no está en el repositorio
        run: |
          if [ -f web/config.js ]; then
            echo "ERROR: web/config.js está en el repositorio y debería generarlo el despliegue."
            exit 1
          fi

  deploy:
    name: Desplegar
    needs: [api, infra, web]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Solo este job pide el token OIDC.
    permissions:
      id-token: write
      contents: read

    # Un despliegue no se cancela a medias: un apply cortado deja el estado
    # bloqueado.
    concurrency:
      group: deploy
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v5

      - name: Credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: bookslot-deploy-${{ github.run_id }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.10.5'
          terraform_wrapper: false

      # El nombre del bucket del estado lleva el id de cuenta y un bloque
      # backend no admite interpolacion, asi que se pasa en el init.
      #
      # terraform.tfvars no esta en el repositorio: alert_email entra como
      # variable de entorno.
      - name: Terraform
        id: tf
        working-directory: infra
        env:
          TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
        run: |
          CUENTA=$(aws sts get-caller-identity --query Account --output text)
          terraform init -input=false \
              -backend-config="bucket=bookslot-tfstate-$CUENTA"
          terraform apply -auto-approve -input=false

          terraform output -json > /tmp/outputs.json
          for k in api_invoke_url web_url web_bucket_name \
                   cloudfront_distribution_id cognito_user_pool_id cognito_client_id; do
            echo "$k=$(jq -r ".$k.value" /tmp/outputs.json)" >> "$GITHUB_OUTPUT"
          done

      # La interfaz no la gestiona Terraform.
      - name: Publicar la interfaz
        run: |
          cat > web/config.js <<CFG
          window.BOOKSLOT_CONFIG = {
            apiBaseUrl: "${{ steps.tf.outputs.api_invoke_url }}",
            userPoolId: "${{ steps.tf.outputs.cognito_user_pool_id }}",
            clientId:   "${{ steps.tf.outputs.cognito_client_id }}"
          };
          CFG

          aws s3 sync web/ "s3://${{ steps.tf.outputs.web_bucket_name }}/" \
            --delete --exclude "config.example.js"

          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.tf.outputs.cloudfront_distribution_id }}" \
            --paths '/*'

      - name: Resumen
        run: |
          echo "Aplicacion: ${{ steps.tf.outputs.web_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "API: ${{ steps.tf.outputs.api_invoke_url }}" >> "$GITHUB_STEP_SUMMARY"

  pruebas:
    name: Pruebas
    needs: [deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      id-token: write
      contents: read

    concurrency:
      group: pruebas
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v5

      - name: Credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: bookslot-pruebas-${{ github.run_id }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.10.5'
          terraform_wrapper: false

      # scripts/env.sh lee los outputs de Terraform, asi que este job necesita
      # su propio init: corre en una maquina distinta a la del despliegue.
      - name: Estado de Terraform
        working-directory: infra
        run: |
          CUENTA=$(aws sts get-caller-identity --query Account --output text)
          terraform init -input=false \
              -backend-config="bucket=bookslot-tfstate-$CUENTA"

      # El administrador y las pruebas van en el MISMO paso a proposito: la
      # contrasena se genera al vuelo y se queda en una variable de shell. Si
      # cruzara a otro paso tendria que pasar por env, y GitHub imprime el
      # bloque env en el log.
      - name: Idempotencia y concurrencia
        run: |
          chmod +x scripts/*.sh scripts/test/*.sh

          # uuidgen esta en uuid-runtime, que no siempre viene en la imagen.
          command -v uuidgen >/dev/null || sudo apt-get install -y -qq uuid-runtime

          POOL=$(terraform -chdir=infra output -raw cognito_user_pool_id)
          EMAIL="pipeline-admin@example.com"
          CLAVE="$(openssl rand -base64 18)Aa1"

          aws cognito-idp admin-create-user \
              --user-pool-id "$POOL" --username "$EMAIL" --message-action SUPPRESS \
              --user-attributes Name=email,Value="$EMAIL" Name=email_verified,Value=true Name=name,Value=Pipeline \
              >/dev/null 2>&1 || true

          aws cognito-idp admin-set-user-password \
              --user-pool-id "$POOL" --username "$EMAIL" --password "$CLAVE" --permanent

          aws cognito-idp admin-add-user-to-group \
              --user-pool-id "$POOL" --username "$EMAIL" --group-name admins

          # Cada prueba necesita una franja sin reservas, de ahi los dos seed.sh.
          ./scripts/test/seed-users.sh 10

          ./scripts/test/seed.sh "$EMAIL" "$CLAVE" 3 120
          ./scripts/test/idempotency-test.sh

          ./scripts/test/seed.sh "$EMAIL" "$CLAVE" 3 120
          ./scripts/test/concurrency-test.sh 8

      - name: Guardar las evidencias
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: evidencias-${{ github.run_id }}
          path: docs/evidencias/
